name: Build platform binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      TARGET: ${{ matrix.target }}
      RELEASE_REF: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_REF_TYPE: ${{ github.ref_type }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist
      - name: Install Linux desktop and native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libgbm-dev libwayland-dev libegl-dev pkg-config libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - name: Build desktop CLI and relay
        run: cargo build --locked --release --target "$TARGET" -p roc-remote -p roc-remote-relay
      - name: Build native NSH controller
        run: cargo build --locked --release --target "$TARGET" -p roc-remote-native
      - name: Verify native interaction and operation lifetime regressions
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked --release --target "$TARGET" -p roc-remote-native
      - name: Build headless CLI without desktop dependencies
        run: cargo build --locked --release --target "$TARGET" --target-dir target/headless -p roc-remote --no-default-features
      - name: Package unsigned binaries
        run: |
          version="dev-$RELEASE_SHA"
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then version="$RELEASE_REF"; fi
          python3 scripts/release.py binaries --version "$version" --target "$TARGET" --binary-dir "target/$TARGET/release" --headless-dir "target/headless/$TARGET/release" --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
