services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lightremote-relay:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      LIGHTREMOTE_RELAY_TOKEN: ${LIGHTREMOTE_RELAY_TOKEN:?Set a strong operator token}
      LIGHTREMOTE_MAX_ROOMS: ${LIGHTREMOTE_MAX_ROOMS:-128}
      LIGHTREMOTE_ROOM_TTL_SECONDS: ${LIGHTREMOTE_ROOM_TTL_SECONDS:-3600}
      LIGHTREMOTE_WAIT_SECONDS: ${LIGHTREMOTE_WAIT_SECONDS:-30}
      LIGHTREMOTE_ALLOWED_ORIGINS: ${LIGHTREMOTE_ALLOWED_ORIGINS:-}
      LIGHTREMOTE_PUBLIC_ORIGIN: ${LIGHTREMOTE_PUBLIC_ORIGIN:-http://localhost:8787}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
