services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: roc-remote-relay:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      ROC_REMOTE_RELAY_TOKEN: ${ROC_REMOTE_RELAY_TOKEN:?Set a strong operator token}
      ROC_REMOTE_MAX_ROOMS: ${ROC_REMOTE_MAX_ROOMS:-128}
      ROC_REMOTE_ROOM_TTL_SECONDS: ${ROC_REMOTE_ROOM_TTL_SECONDS:-3600}
      ROC_REMOTE_WAIT_SECONDS: ${ROC_REMOTE_WAIT_SECONDS:-30}
      ROC_REMOTE_ALLOWED_ORIGINS: ${ROC_REMOTE_ALLOWED_ORIGINS:-}
      ROC_REMOTE_PUBLIC_ORIGIN: ${ROC_REMOTE_PUBLIC_ORIGIN:-http://localhost:8787}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
