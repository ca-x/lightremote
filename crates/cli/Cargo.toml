[package]
name = "roc-remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["desktop"]
desktop = ["roc-remote-services/desktop"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
roc-remote-core = { path = "../core" }
roc-remote-services = { path = "../services", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
crossterm = "0.29"

[dev-dependencies]
roc-remote-relay = { path = "../relay" }
axum = "0.8"
tempfile = "3"
