[package]
name = "roc-remote-services"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "Permission-gated host services for roc-remote byte streams"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:xcap", "dep:enigo", "dep:arboard", "dep:image"]

[dependencies]
anyhow = "1"
cap-std = "4"
cap-fs-ext = "4"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "sync", "time", "rt", "macros", "fs"] }
uuid = { version = "1", features = ["v4"] }
xcap = { version = "0.9.8", optional = true }
enigo = { version = "0.6.1", optional = true, default-features = false, features = ["x11rb"] }
arboard = { version = "3.7", optional = true, default-features = false }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
