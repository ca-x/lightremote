[package]
name = "lightremote-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Bounded authenticated WebSocket rendezvous for LightRemote"

[dependencies]
axum = { version = "0.8.6", features = ["ws"] }
base64 = "0.22.1"
futures-util = "0.3.31"
rand = "0.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
subtle = "2.6.1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
url = "2.5.7"
tower-http = { version = "0.6.6", features = ["fs"] }

[dev-dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["json"] }
tokio-tungstenite = "0.28.0"
