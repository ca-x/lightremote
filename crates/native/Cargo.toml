[package]
name = "lightremote-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lightremote-core = { path = "../core" }
lightremote-updater = { path = "../updater" }
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "fs", "time", "macros"] }
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "0e4a20bd41ee72a35515cecbf9a7fba88742d911" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "0e4a20bd41ee72a35515cecbf9a7fba88742d911", default-features = false, features = ["term"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/longbridge/nsh", rev = "0e4a20bd41ee72a35515cecbf9a7fba88742d911", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", rev = "0e4a20bd41ee72a35515cecbf9a7fba88742d911", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSImageView"] }
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "0e4a20bd41ee72a35515cecbf9a7fba88742d911", default-features = false }

[dev-dependencies]
lightremote-relay = { path = "../relay" }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
